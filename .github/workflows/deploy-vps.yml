name: Deploy to VPS

on:
  # فقط پس از اتمام موفق CI روی main (پوش قرمز هرگز deploy نمی‌شود)
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # اجرای دستیِ انتخاب‌شده (مثلاً برای retry) — مستقل از CI
  workflow_dispatch:
    inputs:
      sha:
        description: 'SHA دقیقی که باید مستقر شود (باید CI سبز داشته باشد)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # دو deploy هم‌زمان روی یک VPS ممنوع — صف‌بندی به‌جای لغوِ وسطِ کار.
    # این قفل در سطحِ *job* است نه در سطحِ workflow: اجرایی که منتظرِ تأییدِ دستیِ
    # محیطِ production مانده، jobِ خودش را شروع نکرده ⇒ دیگر صفِ استقرارهای بعدی را
    # قفل نمی‌کند (پیش‌تر یک اجرای معلقِ قدیمی، همهٔ استقرارهای بعدی را متوقف کرد).
    concurrency:
      group: production-vps-deploy
      cancel-in-progress: false
    # دروازهٔ تأیید دستی: job روی محیط «production» اجرا می‌شود. تا وقتی در تنظیمات
    # مخزن برای این محیط قاعدهٔ «Required reviewers» تعریف نشده باشد، GitHub محیط را
    # خودکار می‌سازد و استقرار بدون دروازه ادامه می‌یابد. با تعریف قاعده، هر استقرار
    # تا تأیید دستیِ اپراتور معلق می‌ماند و به VPS دسترسی پیدا نمی‌کند.
    environment: production
    env:
      # SHA کامیتِ محرک CI (برای اجرای دستی: نوکِ ref انتخاب‌شده)
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      # پورتِ SSH (پیش‌فرض ۲۲؛ اگر sshd روی پورتِ دیگری گوش می‌دهد، همین secret
      # را به‌روز کنید — نیازی به ویرایشِ این فایل نیست)
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
    steps:
      # بدون secrets کافی، خطا روشن و سریع است (به‌جای شکست مبهم وسط SSH)
      - name: Preflight — required secrets must exist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_FPR: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          fail=0
          if [ -z "$VPS_HOST" ]; then echo "::error::secret VPS_HOST is not set"; fail=1; fi
          if [ -z "$VPS_KEY" ]; then echo "::error::secret VPS_SSH_PRIVATE_KEY is not set"; fail=1; fi
          if [ -z "$VPS_FPR" ]; then echo "::error::secret VPS_HOST_FINGERPRINT is not set (ssh-keyscan output)"; fail=1; fi
          exit $fail

      # پیش از هر چیز: آیا اصلاً می‌شود به VPS وصل شد؟
      # تا ۱۹ اکتبر ۲۰۲۶ دیوارِ آتشِ سرویس‌دهنده همهٔ ترافیکِ ورودیِ TCP را دور
      # می‌ریخت؛ نتیجه یک timeoutِ مبهم در مرحلهٔ scp بود و هیچ‌کس نمی‌دانست مشکل
      # از کجاست. این مرحله همان را به یک خطای صریح تبدیل می‌کند (و ۶۰ ثانیه
      # معطلی را ۱۰ ثانیه می‌کند). آدرسِ VPS هرگز چاپ نمی‌شود (secret است).
      - name: Preflight — the VPS must accept TCP on the SSH port
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ env.VPS_PORT }}
        run: |
          set -u
          if [ -z "$VPS_HOST" ]; then echo "::error::VPS_HOST خالی است — پیش‌شرط‌ها متوقف شد."; exit 1; fi
          if timeout 10 bash -c "exec 3<>/dev/tcp/$VPS_HOST/$VPS_PORT" 2>/dev/null; then
            echo "VPS on port $VPS_PORT is reachable from the runner."
          else
            echo "::error::VPS روی پورت $VPS_PORT از رانرِ Actions در دسترس نیست (timeout). فایروالِ سرویس‌دهنده یا allowlist را بررسی کنید."
            exit 1
          fi

      # OPS-05: مسیرِ اجرای دستی هم باید یک اجرای موفقِ CI برای همان SHA داشته باشد.
      # (fail-closed: اگر وضعیت قابل تعیین نبود، اجازهٔ استقرار داده نمی‌شود.)
      - name: Verify the target SHA has a successful CI run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/$REPO/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "test") | .conclusion] | first // "none"')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI برای $SHA موفق نیست (conclusion=$conclusion) — استقرار متوقف شد."
            exit 1
          fi
          echo "CI برای $SHA سبز است."

      # اکشن‌ها به SHA کامیت پین شده‌اند (تگ متحرک = تغییر بی‌اعلام)
      # OPS-04: checkout باید روی همان SHA باشد تا «اسکریپتِ استقرار» و «کدِ مستقرشده»
      # از یک کامیت بیایند (قبلاً اسکریپت از headِ شاخهٔ پیش‌فرض برداشته می‌شد).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Copy deploy script to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ env.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: deploy/deploy.sh
          target: /tmp/newsbot-deploy.sh

      - name: Run deploy (backup → sync → gate → restart → health)
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ env.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 20m
          envs: TARGET_SHA
          script: |
            chmod +x /tmp/newsbot-deploy.sh
            bash /tmp/newsbot-deploy.sh deploy "$TARGET_SHA"
