name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# اجرای تکراریِ همان ref لغو شود — deploy هرگز از این گروه لغو نمی‌شود (گروه جدا دارد)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TEST-01 / DEVOPS-05: دروازه‌های کیفیت ───────────────────────────────────
  # همهٔ گیت‌ها در *یک* job هستند تا نامِ وضعیتِ «test» (که در حفاظتِ شاخهٔ main
  # به‌عنوان checkِ لازم ثبت شده) واقعاً *همهٔ* گیت‌ها را پوشش دهد: اگر یک گیت در
  # jobِ جدا بود، شکستِ آن merge را متوقف نمی‌کرد.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # اکشن‌ها به SHA کامیت پین شده‌اند (تگ متحرک = تغییر بی‌اعلام)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies (pinned, dev included)
        run: |
          python -m pip install "pip==26.2.2"
          pip install -r requirements-dev.txt

      # ── گیت‌های ایستا ─────────────────────────────────────────────────────────
      - name: Static guard (pyflakes — zero undefined names)
        run: python -m pyflakes newsbot tools run.py tests
      - name: Lint (ruff — the rule set lives in pyproject.toml)
        run: ruff check newsbot tests tools run.py
      - name: Types (mypy — gradual, newsbot only)
        run: mypy newsbot
      - name: Syntax check (all modules)
        run: python -m py_compile run.py $(find newsbot tools tests -name '*.py')

      # ── گیت‌های امنیتی ────────────────────────────────────────────────────────
      - name: Dependency audit (pip-audit — pinned requirements)
        run: pip-audit -r requirements.txt --no-deps
      - name: Secret scan (gitleaks)
        # v2.3.9 هیچ inputِ with: ندارد (warning می‌دهد) و برای رویدادِ pull_request
        # به GITHUB_TOKEN نیاز دارد؛ allowlistِ فیکسچرهای تست در .gitleaks.toml است.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dockerfile lint (hadolint)
        # hadolint inside the container reads the Dockerfile from stdin (a host path
        # like deploy/Dockerfile does not exist inside the container).
        run: |
          docker run --rm -i hadolint/hadolint@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e \
            < deploy/Dockerfile
      - name: Filesystem scan (trivy)
        # trivy-action نسخهٔ flottendeٔ خودش را نصب می‌کند (run 42194301756 fail شد);
        # در عوض trivy را با digestِ پین‌شده اجرا می‌کنیم و مخزن را mount می‌کنیم تا
        # .trivyignore (ریشهٔ repo) اعمال شود.
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56 \
            fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 /src

      # ── تست و پوشش (TEST-01) ──────────────────────────────────────────────────
      - name: Unit + integration tests (with the coverage gate)
        run: |
          pytest -q \
            --cov=newsbot \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --junitxml=junit.xml \
            --cov-fail-under=68
      - name: Independent verification (Phase 10)
        run: python tools/final_verification.py
      - name: Config self-check (dummy env)
        env:
          BOT_TOKEN: "123456789:AAci_dummy_token_for_preflight_check_only_0000"
          SUPER_ADMIN_IDS: "1"
          DB_FILE: "/tmp/ci-newsbot.db"
        run: python run.py --check

      # ── ایمیجِ production (همان ایمیجی که روی VPS اجرا می‌شود) ───────────────
      - name: Build the production image
        run: |
          docker build \
            --build-arg "NEWSBOT_VERSION=${{ github.sha }}" \
            -f deploy/Dockerfile -t "newsbot-ci:${{ github.sha }}" .
      - name: Image scan (trivy)
        # همان digestِ پین‌شده؛ .trivyignoreِ ریشهٔ repo هم اعمال می‌شود.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" -w /src aquasec/trivy@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56 \
            image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "newsbot-ci:${{ github.sha }}"
      - name: Compose config is valid
        # The production env file lives on the VPS (/etc/newsbot/env); the
        # runner has none, so validate the compose file against a stub.
        env:
          NEWSBOT_ENV_FILE: ${{ runner.temp }}/newsbot-ci.env
        run: |
          : > "$NEWSBOT_ENV_FILE"
          docker compose -f docker-compose.yml config --quiet

      # ── DEVOPS-06/07: حفاظتِ مخزن (فقط وقتی توکنِ ادمین موجود باشد) ───────────
      # توکنِ GITHUB_TOKEN مجوزِ «administration: read» ندارد ⇒ این گیت فقط وقتی
      # اجرا می‌شود که یک PAT با آن مجوز به‌صورتِ secret داده شده باشد.
      # این مرحله *داخلِ* jobِ test است تا همان یک checkِ لازمِ شاخهٔ main همهٔ
      # گیت‌ها را پوشش دهد (شکستِ یک jobِ جدا merge را متوقف نمی‌کند).
      - name: Verify the branch and environment protection
        # «secrets» در ifِ مرحله مجاز نیست (workflow parse نمی‌شود) ⇒ توکن را در env
        # می‌گیریم و در خودِ اسکریپت تصمیم می‌گیریم.
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::GH_ADMIN_TOKEN is not set — skipping the repository-protection check (set the secret to enable it in CI)."
            exit 0
          fi
          python tools/verify_github_protection.py --repo "${{ github.repository }}"

      # ── شواهدِ قابلِ بازرسی ───────────────────────────────────────────────────
      - name: Upload the coverage and the test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-and-tests-${{ github.run_id }}
          path: |
            coverage.xml
            coverage.json
            junit.xml
          if-no-files-found: warn
          retention-days: 14

