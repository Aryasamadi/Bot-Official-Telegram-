<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="NewsBot v4 — Autonomous Telegram channel publishing powered by multi-model AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080C1A"/>
      <stop offset="52%" stop-color="#111731"/>
      <stop offset="100%" stop-color="#1C1040"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="48%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="markbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.05" fill="#FFFFFF" fill-opacity="0.075"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#dots)"/>

  <circle cx="185" cy="70" r="230" fill="url(#glowA)" filter="url(#soft)"/>
  <circle cx="1055" cy="365" r="250" fill="url(#glowB)" filter="url(#soft)"/>
  <circle cx="640" cy="430" r="190" fill="url(#glowC)" filter="url(#soft)"/>

  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>

  <g transform="translate(72, 62)">
    <rect x="0" y="0" width="76" height="76" rx="22" fill="url(#markbg)" filter="url(#drop)"/>
    <g fill="#FFFFFF">
      <rect x="17" y="40" width="7.5" height="19" rx="3.75"/>
      <rect x="30.5" y="31" width="7.5" height="28" rx="3.75"/>
      <rect x="44" y="22" width="7.5" height="37" rx="3.75"/>
      <rect x="57.5" y="34" width="7.5" height="25" rx="3.75" opacity="0.55"/>
    </g>
    <circle cx="61.25" cy="21" r="5.5" fill="#22D3EE"/>
  </g>

  <text x="176" y="104" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#8FA3C8" letter-spacing="3.2">NEWSBOT</text>

  <text x="72" y="212" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="82" font-weight="800" fill="#FFFFFF" letter-spacing="-1.6">NewsBot <tspan fill="url(#brand)">v4</tspan></text>

  <rect x="74" y="240" width="168" height="5.5" rx="2.75" fill="url(#brand)"/>

  <text x="72" y="294" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="27.5" font-weight="500" fill="#C4D2EA">Autonomous Telegram channel publishing, driven by multi-model AI.</text>
  <text x="72" y="331" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#7E90B4">Crash-safe delivery · Atomic transactions · SSRF and prompt-injection hardened</text>

  <g font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18.5" font-weight="600" fill="#DCE6F7">
    <g transform="translate(72, 362)">
      <rect x="0" y="0" width="152" height="38" rx="19" fill="url(#pill)" stroke="#4F8CFF" stroke-opacity="0.45" stroke-width="1.2"/>
      <text x="76" y="24.5" text-anchor="middle">RSS · Atom · API</text>
    </g>
    <g transform="translate(238, 362)">
      <rect x="0" y="0" width="128" height="38" rx="19" fill="url(#pill)" stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="1.2"/>
      <text x="64" y="24.5" text-anchor="middle">Multi-model AI</text>
    </g>
    <g transform="translate(380, 362)">
      <rect x="0" y="0" width="150" height="38" rx="19" fill="url(#pill)" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.2"/>
      <text x="75" y="24.5" text-anchor="middle">Crash-safe queue</text>
    </g>
    <g transform="translate(544, 362)">
      <rect x="0" y="0" width="150" height="38" rx="19" fill="url(#pill)" stroke="#4F8CFF" stroke-opacity="0.45" stroke-width="1.2"/>
      <text x="75" y="24.5" text-anchor="middle">SQLite · D1</text>
    </g>
    <g transform="translate(708, 362)">
      <rect x="0" y="0" width="112" height="38" rx="19" fill="url(#pill)" stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="1.2"/>
      <text x="56" y="24.5" text-anchor="middle">fa · en</text>
    </g>
    <g transform="translate(834, 362)">
      <rect x="0" y="0" width="176" height="38" rx="19" fill="url(#pill)" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.2"/>
      <text x="88" y="24.5" text-anchor="middle">161 tests green</text>
    </g>
  </g>
</svg>
