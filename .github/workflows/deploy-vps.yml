name: Deploy to VPS

on:
  push:
    branches:
      - main

permissions:
  contents: read

# دو deploy هم‌زمان روی یک VPS ممنوع — صف‌بندی به‌جای لغوِ وسطِ کار
concurrency:
  group: production-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/bot-ai-automatic
            # پیش‌شرط‌ها — اگر محیط سالم نیست deploy قبل از هر تغییری متوقف می‌شود
            test -f .env
            test -x .venv/bin/python
            mkdir -p /opt/backups
            # 1) بک‌اپ سازگار با SQLite در حال اجرا (sqlite3.backup در WAL هم یکپارچه است؛
            #    `cp` ساده می‌تواند نسخه‌ای نیمه‌کاره از DB در حال نوشتن بگیرد)
            if [ -f newsbot.db ]; then
              backup="/opt/backups/newsbot-$(date +%Y%m%d-%H%M%S).db"
              /usr/bin/python3 - "newsbot.db" "$backup" <<'PY'
            import sqlite3, sys
            src = sqlite3.connect(sys.argv[1], timeout=30)
            dst = sqlite3.connect(sys.argv[2])
            try:
                src.backup(dst)
            finally:
                dst.close()
                src.close()
            PY
              chmod 600 "$backup"
              # فقط 7 بک‌اپ اخیر نگه داشته می‌شود
              ls -1t /opt/backups/newsbot-*.db | tail -n +8 | xargs -r rm --
            fi
            # 2) همگام‌سازی کد (reset --hard فقط فایل‌های tracked را می‌برد؛ .env و newsbot.db ignore شده‌اند)
            git fetch origin main
            git reset --hard origin/main
            # 3) وابستگی‌ها
            .venv/bin/pip install -r requirements.txt
            # 4) گیت سلامت پیش از restart: اگر سینتکس/پیکربندی/اسکیما خراب باشد، سرویس قدیمی دست‌نخورده می‌ماند
            .venv/bin/python -m compileall -q newsbot run.py
            .venv/bin/python run.py --check
            # 5) راه‌اندازی مجدد و تأیید
            systemctl restart bot-ai-automatic
            sleep 3
            systemctl is-active --quiet bot-ai-automatic
