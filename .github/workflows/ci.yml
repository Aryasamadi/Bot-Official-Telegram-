name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# اجرای تکراریِ همان ref لغو شود — deploy هرگز از این گروه لغو نمی‌شود (گروه جدا دارد)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # اکشن‌ها به SHA کامیت پین شده‌اند (تگ متحرک = تغییر بی‌اعلام)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install dependencies (pinned, dev included)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Static guard (pyflakes — zero undefined names)
        run: python -m pyflakes newsbot tools run.py tests
      - name: Syntax check (all modules)
        run: python -m py_compile run.py $(find newsbot tools tests -name '*.py')
      - name: Unit + integration tests
        run: pytest -q
      - name: Independent verification (Phase 10)
        run: python tools/final_verification.py
      - name: Config self-check (dummy env)
        env:
          BOT_TOKEN: "123456789:AAci_dummy_token_for_preflight_check_only_0000"
          SUPER_ADMIN_IDS: "1"
          DB_FILE: "/tmp/ci-newsbot.db"
        run: python run.py --check

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production image
        run: docker build -f deploy/Dockerfile -t newsbot-ci:${{ github.sha }} .
