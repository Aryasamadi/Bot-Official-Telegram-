[Unit]
# PHASE-04 (رخداد تولید 2026-10-21): پیش‌تر این مقدار صفر بود ⇒ یک سرویسِ خراب بی‌نهایت
# هر ۵ ثانیه ری‌استارت می‌شد و CPU را ۱۰۰٪ نگه می‌داشت (همان چیزی که در رخداد دیده شد).
# حالا: اگر سرویس در ۵ دقیقه ۵ بار شکست بخورد، systemd **دست از تلاش برمی‌آید** و یونیت
# در حالتِ failed می‌ماند ⇒ مصرفِ CPU متوقف می‌شود و خطا **قابل‌دیدن** می‌شود
# (`systemctl status` / `journalctl -u <unit>`). پس از رفعِ علت:
#   systemctl reset-failed <unit> && systemctl start <unit>
# اگر «هرگز خاموش نماند» برایتان اولویتِ مطلق است، این دو خط را به `0` برگردانید — اما آگاه باشید
# که هزسته‌ای که در این حالت CPU را می‌سوزاند، همان چیزی است که در رخداد دیده شد.
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=always
RestartSec=5
ExecStopPost=/bin/sh -c 'logger -t bot-ai-automatic "stop result=$SERVICE_RESULT exit=$EXIT_CODE status=$EXIT_STATUS"'
