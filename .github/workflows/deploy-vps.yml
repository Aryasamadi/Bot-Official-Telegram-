name: Deploy to VPS

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/bot-ai-automatic
            # 1) بک‌اپ دیتابیس محلی پیش از هر تغییر (بک‌اند d1 نیازی به بک‌اپ محلی ندارد)
            mkdir -p /opt/backups
            if [ -f newsbot.db ]; then
              cp newsbot.db "/opt/backups/newsbot-$(date +%Y%m%d-%H%M%S).db"
              # فقط 7 بک‌اپ اخیر نگه داشته می‌شود
              ls -1t /opt/backups/newsbot-*.db | tail -n +8 | xargs -r rm --
            fi
            # 2) همگام‌سازی کد (reset --hard فقط فایل‌های tracked را می‌برد؛ .env و newsbot.db ignore شده‌اند)
            git fetch origin main
            git reset --hard origin/main
            # 3) وابستگی‌ها
            /opt/bot-ai-automatic/.venv/bin/pip install -r requirements.txt
            # 4) گیت سلامت پیش از restart: اگر پیکربندی/اسکیما خراب باشد، سرویس قدیمی دست‌نخورده می‌ماند
            /opt/bot-ai-automatic/.venv/bin/python run.py --check
            # 5) راه‌اندازی مجدد و تأیید
            systemctl restart bot-ai-automatic
            sleep 3
            systemctl is-active --quiet bot-ai-automatic
