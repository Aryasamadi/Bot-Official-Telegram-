name: QA Live Acceptance

# پذیرشِ زندهٔ فاز ۴ روی تلگرامِ واقعی — فقط دستی.
# خروجی: report.json + bot.log به‌عنوان artifact؛ دیتابیسِ تست هرگز آپلود نمی‌شود.
on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'حداکثر مدت اجرا (دقیقه، ۵ تا ۳۴۰)'
        required: false
        default: "340"
        type: string
      scenario:
        description: 'سناریو'
        required: false
        default: core
        type: choice
        options: [core, full, duration]
      db_mode:
        description: 'دیتابیس: reuse از کش، یا fresh تازه'
        required: false
        default: reuse
        type: choice
        options: [reuse, fresh]

permissions:
  contents: read

concurrency:
  group: qa-live
  cancel-in-progress: false

jobs:
  qa-live:
    name: qa-live
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Restore the test DB
        if: inputs.db_mode == 'reuse'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/qa-live/newsbot.db
          key: qa-live-db-v2-${{ github.run_id }}
          restore-keys: qa-live-db-v2-
      - name: Validate secure inputs
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          SUPER_ADMIN_IDS: ${{ secrets.SUPER_ADMIN_ID || secrets.SUPER_ADMIN_IDS }}
          QA_DURATION: ${{ inputs.duration_minutes }}
        run: |
          # فقط کدِ وضعیت چاپ میشود؛ مقدارِ هیچ رازی نه در لاگ و نه در خطای فرمان نمیآید.
          if [ -z "${QA_DURATION}" ] || ! printf '%s' "${QA_DURATION}" | grep -Eq '^[0-9]+$' \
             || [ "${QA_DURATION}" -lt 5 ] || [ "${QA_DURATION}" -gt 340 ]; then
            echo "BAD_DURATION"
            exit 2
          fi
          if [ -z "${BOT_TOKEN}" ]; then
            echo "TOKEN_MISSING"
            exit 2
          fi
          if ! printf '%s' "${SUPER_ADMIN_IDS}" | grep -Eq '^[0-9,;[:space:]]+$' \
             || ! printf '%s' "${SUPER_ADMIN_IDS}" | grep -Eq '[0-9]'; then
            echo "SUPER_ID_INVALID"
            exit 2
          fi
          echo "INPUTS_OK"
      - name: Install dependencies
        run: |
          python -m pip install "pip==26.2.2"
          pip install -r requirements.txt
      - name: Run the live acceptance
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          SUPER_ADMIN_IDS: ${{ secrets.SUPER_ADMIN_ID || secrets.SUPER_ADMIN_IDS }}
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
          DB_BACKEND: sqlite
          DB_FILE: ${{ runner.temp }}/qa-live/newsbot.db
          QA_ENABLED: "1"
          REPORT: ${{ runner.temp }}/qa-live/report.json
          BOT_LOG: ${{ runner.temp }}/qa-live/bot.log
        run: |
          mkdir -p "$(dirname "$DB_FILE")"
          python tools/qa_live_acceptance.py --supervise \
            --duration "${{ inputs.duration_minutes }}" \
            --scenario "${{ inputs.scenario }}" \
            --report "$REPORT" --log "$BOT_LOG"
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qa-live/report.json
            ${{ runner.temp }}/qa-live/bot.log
          if-no-files-found: warn
          retention-days: 14
      - name: Save the test DB for the next run
        if: always()
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/qa-live/newsbot.db
          key: qa-live-db-v2-${{ github.run_id }}
