name: Deploy to VPS

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and validate on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/bot-official-telegram
            test -f .env
            test -x venv/bin/python
            mkdir -p /opt/backups

            # Make a consistent SQLite backup without stopping the running service.
            if [ -f data/newsbot.db ]; then
              backup="/opt/backups/newsbot-$(date +%Y%m%d-%H%M%S).db"
              /usr/bin/python3 - "data/newsbot.db" "$backup" <<'PY'
            import sqlite3, sys
            src = sqlite3.connect(sys.argv[1], timeout=30)
            dst = sqlite3.connect(sys.argv[2])
            try:
                src.backup(dst)
            finally:
                dst.close()
                src.close()
            PY
              chmod 600 "$backup"
              find /opt/backups -maxdepth 1 -type f -name 'newsbot-*.db' -printf '%T@ %p\n' | sort -nr | awk 'NR > 7 {sub(/^[^ ]+ /, ""); print}' | xargs -r rm --
            fi

            # Update tracked source only; .env and local data remain untouched.
            git fetch origin main
            git reset --hard origin/main
            venv/bin/pip install -r requirements.txt
            venv/bin/python -m compileall -q newsbot run.py
            venv/bin/python run.py --check

            # Keep systemd's entry point aligned with the modular application.
            cat > /etc/systemd/system/newsbot.service <<'UNIT'
            [Unit]
            Description=Bot Official Telegram
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/bot-official-telegram
            EnvironmentFile=/opt/bot-official-telegram/.env
            ExecStartPre=/opt/bot-official-telegram/venv/bin/python /opt/bot-official-telegram/run.py --check
            ExecStart=/opt/bot-official-telegram/venv/bin/python /opt/bot-official-telegram/run.py
            Restart=always
            RestartSec=5
            KillSignal=SIGTERM
            TimeoutStopSec=40
            UMask=0077
            ProtectSystem=strict
            ReadWritePaths=/opt/bot-official-telegram/data

            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable newsbot
            systemctl restart newsbot
            sleep 3
            systemctl is-active --quiet newsbot
